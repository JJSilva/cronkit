[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "schedulesync"
version = "0.1.0"
description = "Sync timed TrainingPeaks workouts into Google Calendar"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.5.0",
]

[project.scripts]
schedulesync = "schedulesync.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/schedulesync"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Run the suite straight from the source tree, with or without an install.
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
